version: 2

models:
  - name: bronze_fact_sales
    config:
      materialized: view
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null

  - name: bronze_dim_customer
    config:
      materialized: view

  - name: bronze_dim_product
    config:
      materialized: view

  - name: bronze_dim_store
    config:
      materialized: view
    columns:
      - name: country
        data_tests:
          - accepted_values:
              values:
                - "USA"
                - "Canada"
                - "Mexico"

  - name: bronze_dim_date
    config:
      materialized: view

  - name: bronze_fact_returns
    config:
      materialized: view
