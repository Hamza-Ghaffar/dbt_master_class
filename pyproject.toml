[project]
name = "dbt"
version = "0.1.0"
description = "dbt master class I will learn for my data engineering journey"
readme = "README.md"
authors = [
    { name = "Hamza Ghaffar", email = "hamza.ghaffar.edu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.10.9",
]

[project.scripts]
dbt = "dbt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
